name: build-app

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      app_dir:
        description: 'Flutter project dir (default: auto-detect pubspec.yaml)'
        required: false
        default: ''

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Analyze ACP protocol layer
        working-directory: app
        run: flutter analyze lib/acp

  apk:
    runs-on: ubuntu-latest
    env:
      # GHA public IPs frequently get 429 from Maven Central; retry tentatives.
      GRADLE_OPTS: >-
        -Dorg.gradle.internal.repository.max.tentatives=5
        -Dorg.gradle.internal.repository.initial.backoff=1000
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect Flutter project dir
        id: detect
        run: |
          DIR="${{ inputs.app_dir }}"
          if [ -z "$DIR" ]; then
            for d in "" app kelivo; do
              if [ -f "${d:+$d/}pubspec.yaml" ]; then DIR="${d:-.}"; break; fi
            done
          fi
          if [ -z "$DIR" ] || [ ! -f "$DIR/pubspec.yaml" ]; then
            echo "::notice::No pubspec.yaml found (looked in ./, app/, kelivo/). Skipping build — add the Flutter project to enable."
            echo "dir=SKIP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Detected project: $DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Android deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 curl tar unzip || true

      - name: Flutter pub get
        if: steps.detect.outputs.dir != 'SKIP'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: flutter pub get

      - name: Build APK (debug-signed, installable, arm64 split)
        if: steps.detect.outputs.dir != 'SKIP'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi

      - name: Upload APK
        if: steps.detect.outputs.dir != 'SKIP'
        uses: actions/upload-artifact@v4
        with:
          name: kelivo-apk
          path: ${{ steps.detect.outputs.dir }}/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error

      # Public, no-login download: publish the signed APK as a GitHub Release
      # asset so it can be fetched from a phone browser reliably.
      - name: Publish APK to GitHub Release
        if: steps.detect.outputs.dir != 'SKIP'
        run: |
          gh release create \
            "kelivo-apk-$(date +%Y%m%d%H%M%S)" \
            "${{ steps.detect.outputs.dir }}/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk" \
            --repo ylwb/myeye \
            --title "Kelivo ACP (debug-signed, installable)" \
            --notes "Installable debug APK. Download, tap to install, allow unknown sources." \
            --generate-notes
