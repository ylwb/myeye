name: acp-integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  handshake:
    runs-on: ubuntu-latest
    env:
      PI_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pi + pi-acp
        run: |
          npm install -g @earendil-works/pi-coding-agent
          npm install
      - name: ACP handshake (no model key required)
        run: node acp-handshake.js

  prompt:
    # Requires a pi model provider configured via repo secrets.
    # The test script skips itself when MODEL_API_KEY is absent, so the
    # public repo CI stays green without a key.
    runs-on: ubuntu-latest
    env:
      PI_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pi + pi-acp
        run: |
          npm install -g @earendil-works/pi-coding-agent
          npm install
      - name: ACP prompt round-trip
        env:
          # Map your provider key into whatever env var pi's provider reads.
          # Example for an OpenAI-compatible provider:
          #   OPENAI_API_KEY: ${{ secrets.MODEL_API_KEY }}
          #   OPENAI_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
        run: node acp-client-piacp.js

  smoke:
    # Dart runtime smoke of the kelivo ACP bridge (AcpSessionManager).
    # Handshake needs no key; prompt round-trip only when MODEL_API_KEY is set.
    runs-on: ubuntu-latest
    env:
      PI_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install pi + pi-acp
        run: |
          npm install -g @earendil-works/pi-coding-agent
          npm install
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Dart ACP smoke (handshake; prompt if MODEL_API_KEY)
        working-directory: app
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
        run: |
          flutter pub get
          dart run tool/acp_smoke.dart
